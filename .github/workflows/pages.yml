name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing generated is committed: the site is built here and the built
# directory is what GitHub Pages publishes, so `tools/` and this workflow
# never reach the served site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: python tools/build.py --out _site

      - name: Links, anchors and markup
        run: python tools/verify.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Pull requests build and are checked, but only main is published.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

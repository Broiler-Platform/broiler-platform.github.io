name: Site

on:
  push:
    branches: [main]
  pull_request:

# The generated pages are committed, because GitHub Pages serves this branch
# directly. That makes it possible to edit a generated file by mistake and have
# the next `tools/build.py` run silently discard the change, so the build is
# verified rather than trusted: --check writes nothing and fails when a
# committed page no longer matches its source in tools/pages/.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pages match their sources
        run: python tools/build.py --check

      - name: Links, anchors and markup
        run: python tools/verify.py
